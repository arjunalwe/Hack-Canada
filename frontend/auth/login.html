<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Co-Pilot</title>
    <meta name="description"
        content="Sign in or create your Co-Pilot account to access AI-powered fundraising intelligence." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />

    <!-- ── Auth0 config — swap these values for your tenant ── -->
    <script>
        window.AUTH0_CONFIG = {
            domain: "dev-uzi6d8f6w5w0310c.us.auth0.com",
            clientId: "9CXr4jjIGbVealhzVYwwYPCI1ePrThbr",
            audience: "",
            redirectUri: "http://localhost:3000/auth/callback.html",
            apiBase: "http://localhost:8000",
        };
    </script>
</head>

<body>

    <!-- Animated background blobs -->
    <div class="a0-bg" aria-hidden="true"></div>

    <!-- Toast notification slot -->
    <div class="a0-toast" id="a0-toast" role="status" aria-live="polite"></div>

    <main class="a0-page">
        <div class="a0-card" id="a0-card">

            <!-- Logo -->
            <div class="a0-logo">
                <div class="a0-logo-symbol">L</div>
                <span class="a0-logo-name">LYNX</span>
            </div>

            <!-- Heading -->
            <h1 class="a0-heading">Welcome back.</h1>
            <p class="a0-sub">Sign in or create an account to continue.</p>

            <!-- Feature badges -->
            <div class="a0-features" aria-label="Security features">
                <span class="a0-badge">🔒 Social Sign-In</span>
                <span class="a0-badge">🛡 MFA</span>
                <span class="a0-badge">✨ Passwordless</span>
                <span class="a0-badge">🤖 AI-Secured</span>
            </div>

            <!-- ── Social logins ─────────────────────────────────── -->
            <button class="a0-btn a0-btn-social" id="btn-google" type="button">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Continue with Google
            </button>

            <button class="a0-btn a0-btn-social" id="btn-github" type="button">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                        d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                </svg>
                Continue with GitHub
            </button>

            <button class="a0-btn a0-btn-social" id="btn-linkedin" type="button">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path
                        d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                </svg>
                Continue with LinkedIn
            </button>

            <!-- ── Divider ─────────────────────────────────────── -->
            <div class="a0-divider">or</div>

            <!-- ── Universal Login (email/password) ───────────── -->
            <button class="a0-btn a0-btn-primary" id="btn-login" type="button">
                <span class="a0-btn-text">Sign in with Email / Password</span>
            </button>

            <button class="a0-btn a0-btn-ghost" id="btn-signup" type="button">
                <span class="a0-btn-text">Create an account →</span>
            </button>

            <!-- ── Passwordless magic-link ─────────────────────── -->
            <div class="a0-divider">passwordless</div>

            <div class="a0-passwordless">
                <label class="a0-label" for="pl-email">Send me a magic link</label>
                <div class="a0-passwordless-row">
                    <input class="a0-input" type="email" id="pl-email" placeholder="you@startup.com"
                        autocomplete="email" />
                    <button class="a0-btn a0-btn-ghost" id="btn-passwordless" type="button">
                        <span class="a0-btn-text">✨ Send</span>
                    </button>
                </div>
            </div>

            <!-- ── Auth0 badge ─────────────────────────────────── -->
            <div class="a0-powered">
                Secured by <span>Auth0</span> · Social · MFA · Passwordless
            </div>

        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        (async () => {
            "use strict";

            // helper: set loading state
            function setLoading(btn, on) {
                if (on) btn.setAttribute("data-loading", "");
                else btn.removeAttribute("data-loading");
            }

            // Social logins
            document.getElementById("btn-google").addEventListener("click", async () => {
                const btn = document.getElementById("btn-google");
                setLoading(btn, true);
                try { await Auth0.loginWithGoogle(); }
                catch (e) { Auth0.showToast(e.message, "err"); setLoading(btn, false); }
            });

            document.getElementById("btn-github").addEventListener("click", async () => {
                const btn = document.getElementById("btn-github");
                setLoading(btn, true);
                try { await Auth0.loginWithGitHub(); }
                catch (e) { Auth0.showToast(e.message, "err"); setLoading(btn, false); }
            });

            document.getElementById("btn-linkedin").addEventListener("click", async () => {
                const btn = document.getElementById("btn-linkedin");
                setLoading(btn, true);
                try { await Auth0.loginWithLinkedIn(); }
                catch (e) { Auth0.showToast(e.message, "err"); setLoading(btn, false); }
            });

            // Email/password — Auth0 Universal Login (login screen)
            document.getElementById("btn-login").addEventListener("click", async () => {
                const btn = document.getElementById("btn-login");
                setLoading(btn, true);
                try { await Auth0.loginWithRedirect(); }
                catch (e) { Auth0.showToast(e.message, "err"); setLoading(btn, false); }
            });

            // Sign Up — Universal Login (signup screen)
            document.getElementById("btn-signup").addEventListener("click", async () => {
                const btn = document.getElementById("btn-signup");
                setLoading(btn, true);
                try { await Auth0.signUp(); }
                catch (e) { Auth0.showToast(e.message, "err"); setLoading(btn, false); }
            });

            // Passwordless magic-link
            document.getElementById("btn-passwordless").addEventListener("click", async () => {
                const email = document.getElementById("pl-email").value.trim();
                const btn = document.getElementById("btn-passwordless");
                if (!email) { Auth0.showToast("Please enter your email address.", "err"); return; }
                setLoading(btn, true);
                try {
                    await Auth0.sendMagicLink(email);
                    Auth0.showToast("✅ Magic link sent! Check your inbox.", "ok");
                } catch (e) {
                    Auth0.showToast(e.message || "Failed to send link.", "err");
                } finally { setLoading(btn, false); }
            });

            // If the user is already logged in, skip to main app
            try {
                await Auth0.init();
                const authed = await Auth0.isAuthenticated();
                if (authed) window.location.replace("../index.html");
            } catch (_) { /* silent — not logged in */ }
        })();
    </script>

</body>

</html>
